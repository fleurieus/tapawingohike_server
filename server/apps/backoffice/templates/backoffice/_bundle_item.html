{# Verwacht context: bundle, route #}
<li id="bundle-{{ bundle.id }}" class="rounded-md border border-tertiary/40 bg-tertiary-container/30 px-2 py-2 flex items-center gap-2">
  <iconify-icon icon="material-symbols:collections-bookmark-outline" width="16" height="16" class="text-tertiary shrink-0"></iconify-icon>
  <span class="text-on-surface flex-1 min-w-0 truncate">
    {{ bundle.name }}
    <span class="ml-1 text-label-sm text-on-surface-variant">({{ bundle.get_browse_mode_display }})</span>
  </span>

  <button class="icon-btn"
          hx-get="{% url 'backoffice:bundle_edit' route.id bundle.id %}"
          hx-target="#sidepanel" hx-swap="innerHTML" title="Bundel bewerken">
    <iconify-icon icon="material-symbols:edit-outline" width="16" height="16"></iconify-icon>
  </button>
  <button class="icon-btn danger"
          hx-post="{% url 'backoffice:bundle_delete' route.id bundle.id %}"
          hx-confirm="Bundel verwijderen? RouteParts worden losgekoppeld (niet verwijderd)."
          hx-target="#bundle-{{ bundle.id }}" hx-swap="outerHTML">
    <iconify-icon icon="material-symbols:delete-outline" width="16" height="16"></iconify-icon>
  </button>
</li>
