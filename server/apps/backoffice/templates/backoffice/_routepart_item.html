{# Verwacht context: route, p (RoutePart met p.dest_count) #}
<li id="rp-{{ p.id }}" class="row-hover rounded-md border {% if p.bundle %}border-tertiary/40 bg-tertiary-container/30{% else %}border-outline-variant{% endif %} px-2 py-2 flex items-center gap-2"
    data-id="{{ p.id }}" data-rp-id="{{ p.id }}">
  <span class="inline-block w-3 h-3 rounded shrink-0" data-legend-color data-rp-id="{{ p.id }}"></span>
  <span class="text-on-surface flex-1 min-w-0 truncate">
    <span class="text-on-surface-variant mr-1 tabular-nums">#{{ p.order }}</span>{{ p.name }}
    <span class="ml-1 text-label-sm text-on-surface-variant">(<span class="dest-count">{{ p.dest_count }}</span> dest)</span>
    {% if p.bundle %}<span class="ml-1 text-label-sm text-tertiary" title="Bundel: {{ p.bundle.name }}"><iconify-icon icon="material-symbols:collections-bookmark-outline" width="12" height="12"></iconify-icon> {{ p.bundle.name }}</span>{% endif %}
    {% if p.route_type == "gallery" %}<span class="ml-1 text-label-sm text-secondary" title="Galerij ({{ p.gallery_images.count }} foto's)"><iconify-icon icon="material-symbols:image-outline" width="12" height="12"></iconify-icon> {{ p.gallery_images.count }}</span>{% endif %}
  </span>

  <button class="icon-btn"
        title="Klik daarna op de kaart om een Destination toe te voegen"
        onclick="window.setActivePart({{ p.id }})"><iconify-icon icon="material-symbols:add" width="18" height="18"></iconify-icon></button>

  <button class="icon-btn"
          hx-get="{% url 'backoffice:routepart_edit' route.id p.id %}"
          hx-target="#sidepanel" hx-swap="innerHTML" title="Instellingen van dit RoutePart"><iconify-icon icon="material-symbols:settings-outline" width="18" height="18"></iconify-icon></button>
  <span class="handle icon-btn" title="Sleep om te ordenen">
    <iconify-icon icon="material-symbols:swap-vert" width="18" height="18"></iconify-icon>
  </span>
    <button class="icon-btn"
            hx-post="{% url 'backoffice:routepart_delete' route.id p.id %}"
            hx-confirm="RoutePart en al zijn Destinations verwijderen?"
            hx-target="#rp-{{ p.id }}" hx-swap="outerHTML">
      <iconify-icon icon="material-symbols:delete-outline" width="18" height="18"></iconify-icon>
    </button>


</li>
