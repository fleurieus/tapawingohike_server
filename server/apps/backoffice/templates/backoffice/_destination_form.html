<div class="card-elevated p-4">
  <h2 class="text-title-md mb-3">{{ pk|yesno:"Bewerk Destination,Nieuwe Destination" }}</h2>
  <form
    hx-post="{{ request.path }}"
    hx-swap="none"
    method="post"
    class="space-y-3"
  >
    {% csrf_token %}
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
      <div>{{ form.lat.label_tag }} {{ form.lat }}</div>
      <div>{{ form.lng.label_tag }} {{ form.lng }}</div>
      <div>{{ form.destination_type.label_tag }} {{ form.destination_type }}</div>
      <div>{{ form.radius.label_tag }} {{ form.radius }}</div>
      <div class="flex items-center gap-4 sm:col-span-2 flex-wrap">
        <label class="inline-flex items-center gap-2">{{ form.confirm_by_user }} <span>Confirm by User</span></label>
        <label class="inline-flex items-center gap-2">{{ form.hide_for_user }} <span>Hide from User</span></label>
        <label class="inline-flex items-center gap-2" title="Sla de GPS-radiuscheck over: de app behandelt dit punt direct als bereikt na het vorige routedeel. Combineer met 'Confirm by User' voor een tik-om-door scherm, of laat dat uit om automatisch door te gaan. Voor tussen-schermen/galerijen.">{{ form.skip_location_check }} <span>Skip location check</span></label>
      </div>
    </div>

    <div class="pt-3 flex flex-col-reverse sm:flex-row sm:justify-end gap-2">
      <button type="button" class="btn-text w-full sm:w-auto"
              onclick="document.getElementById('sidepanel').innerHTML=''">Sluiten</button>
      <button type="submit" class="btn-filled w-full sm:w-auto">Opslaan</button>
    </div>
  </form>
</div>
<script>window.destFormInit && window.destFormInit();</script>
