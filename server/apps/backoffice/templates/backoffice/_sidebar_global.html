{# Global sidebar — for pages without edition context #}
{# Requires nav_active in context #}

<nav class="flex-1 px-2 py-3 space-y-4">
  {# ── Navigatie ── #}
  <div>
    <div class="list-section-label">Navigatie</div>
    <a href="{% url 'backoffice:events_list' %}"
       class="list-item-md3 {% if nav_active == 'events' %}is-active{% endif %}">
      <iconify-icon icon="material-symbols:calendar-month-outline" width="20" height="20"></iconify-icon>
      Events
    </a>
  </div>

  {% if user.is_superuser %}
  {# ── Admin ── #}
  <div>
    <div class="list-section-label">Admin</div>
    <a href="{% url 'backoffice:user_list' %}"
       class="list-item-md3 {% if nav_active == 'users' %}is-active{% endif %}">
      <iconify-icon icon="material-symbols:groups-outline" width="20" height="20"></iconify-icon>
      Gebruikers
    </a>
  </div>
  {% endif %}
</nav>
